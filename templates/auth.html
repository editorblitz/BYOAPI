<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NGI Data Tools</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <h1>NGI Data Tools</h1>
            <p class="auth-subtitle">Sign in with your NGI API credentials</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash flash-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="on">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="email">NGI Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="your.email@company.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="api_key">API Key</label>
                    <input
                        type="password"
                        id="api_key"
                        name="api_key"
                        autocomplete="current-password"
                        placeholder="Enter your NGI API key"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>

            </form>
        </div>
    </div>
</body>
</html>
